<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#0d0f18">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="عاداتي">
<title>عاداتي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap">
<style>
:root{--bg:#0d0f18;--sheet:#181b2e;--field:#222640;--ink:#ffffff;--mute:#8f94b2;--accent:#ff5376;--sun:#ffcb6b;--mint:#c3e88d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#f4f6fc;--sheet:#ffffff;--field:#eef1f8;--ink:#121420;--mute:#646a8a;--accent:#ff3b5c;--sun:#f5a623;--mint:#2ecc71}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo Bhaijaan 2",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.4;overflow-x:hidden}
main{max-width:480px;margin:0 auto;padding:24px 18px 130px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
h1{font-size:30px;font-weight:800;margin:0}
.r{display:flex;gap:10px}
.snd{width:46px;height:46px;border-radius:18px;border:0;background:var(--sheet);color:var(--ink);font-size:20px;cursor:pointer;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.hero-ring-container{display:flex;flex-direction:column;align-items:center;position:relative;margin:10px auto 28px;width:210px;height:210px}
.hero-ring-container svg{width:210px;height:210px;transform:rotate(-90deg)}
.hero-ring-container circle{transition:stroke-dashoffset .8s cubic-bezier(.3,1.4,.5,1)}
.hero-ring-content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px}
.hero-ring-content b{font-size:36px;font-weight:800;line-height:1;margin-top:4px}
.hero-ring-content span{font-size:14px;color:var(--mute);font-weight:700}
.hero{background:var(--sheet);border-radius:32px;padding:20px;margin-bottom:24px;box-shadow:0 16px 40px rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;text-align:center}
.pip{width:96px;height:96px;cursor:pointer;margin-bottom:8px}
.pip svg{width:100%;height:100%;transform:scale(var(--s,1));transform-origin:50% 100%;overflow:visible}
.pip .mh{display:none}.pip.hp .mh{display:block}.pip.hp .mn{display:none}
.pip.jump{animation:jmp .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes jmp{0%{transform:translateY(0)}35%{transform:translateY(-22px) scale(1.08,.94)}70%{transform:translateY(0) scale(.94,1.06)}100%{transform:none}}
.sub-text{font-size:18px;font-weight:700;margin:4px 0 14px;color:var(--ink)}
.lv-box{width:100%;display:flex;align-items:center;gap:12px;margin-top:6px;font-weight:700;font-size:14px;color:var(--mute)}
.lvb{flex:1;height:8px;border-radius:8px;background:var(--field);overflow:hidden}
.lvb i{display:block;height:100%;width:0;background:var(--mint);border-radius:8px;transition:width .4s}
.tabs{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto;padding-bottom:4px}
.tabs button{flex:1;min-width:max-content;height:46px;padding:0 18px;border:0;border-radius:16px;background:var(--sheet);color:var(--mute);font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.tabs button.sel{background:var(--ink);color:var(--bg)}
.card{background:var(--sheet);color:var(--ink);border-radius:28px;padding:18px;margin-bottom:16px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.row{display:flex;align-items:center;gap:14px}
.emo{flex:none;font-size:30px;width:56px;height:56px;border-radius:20px;background:var(--field);display:grid;place-items:center}
.mid{flex:1;min-width:0;cursor:pointer}
.nm{font-weight:800;font-size:20px;line-height:1.2}
.meta{font-size:14px;font-weight:600;color:var(--mute)}
.big{flex:none;width:64px;height:64px;border-radius:50%;border:0;background:var(--field);color:var(--ink);font:inherit;font-weight:800;font-size:20px;cursor:pointer;display:grid;place-items:center}
.big.done{background:var(--mint);color:#0d0f18}
.track{height:10px;border-radius:10px;background:var(--field);margin:14px 0 12px;overflow:hidden}
.track i{display:block;height:100%;background:var(--mint);border-radius:10px}
.week{display:flex;gap:6px}
.wd{flex:1;border:0;height:34px;border-radius:12px;background:var(--field);color:var(--mute);font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.wd.full{background:var(--mint);color:#0d0f18}
.wd.today{outline:2px solid var(--ink)}
.foot{display:flex;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--field)}
.del{background:none;border:0;font:inherit;font-size:13px;font-weight:700;color:var(--mute);cursor:pointer}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;padding:0 32px;height:64px;border:0;border-radius:32px;background:var(--sun);color:#121420;font:inherit;font-weight:800;font-size:19px;cursor:pointer;z-index:5}
.back{position:fixed;inset:0;background:rgba(5,6,12,.7);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
.back.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;background:var(--sheet);border-radius:32px 32px 0 0;padding:24px 20px;transform:translateY(105%);transition:transform .35s;z-index:11;max-height:90vh;overflow:auto}
.sheet.on{transform:none}
.sheet h2{margin:0 0 16px;font-size:24px;font-weight:800}
.sheet label{display:block;margin:16px 0 6px;font-weight:700;color:var(--mute);font-size:14px}
#inp, #why, #tm, #mnm, #vt, #vst, #vu, #rsx{width:100%;padding:14px 16px;font:inherit;font-size:16px;border:0;border-radius:18px;background:var(--field);color:var(--ink);outline:none}
.emos{display:flex;gap:8px;flex-wrap:wrap}
.emos button{width:50px;height:50px;font-size:24px;border:0;border-radius:16px;background:var(--field);cursor:pointer}
.emos button.sel{outline:3px solid var(--ink)}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick button{min-width:48px;height:46px;padding:0 14px;border:0;border-radius:16px;background:var(--field);color:var(--ink);font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.pick button.sel{background:var(--ink);color:var(--bg)}
.step{display:flex;align-items:center;gap:16px;background:var(--field);padding:8px 16px;border-radius:18px}
.step button{width:40px;height:40px;border-radius:50%;border:0;background:var(--sheet);color:var(--ink);font-weight:800;cursor:pointer}
.go{width:100%;margin-top:24px;height:56px;border:0;border-radius:28px;background:var(--ink);color:var(--bg);font:inherit;font-weight:800;font-size:18px;cursor:pointer}
.toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-180%);background:var(--sheet);color:var(--ink);padding:14px 22px;border-radius:20px;font-weight:700;z-index:60;transition:transform .35s}
.toast.on{transform:translate(-50%,0)}
svg{width:28px;height:28px}
</style>
</head>
<body>
<main>
<div class="head">
  <h1>عاداتي</h1>
  <div class="r">
    <button class="snd" id="shb" aria-label="مشاركة">🔗</button>
    <button class="snd" id="stb" aria-label="إحصائيات">📊</button>
    <button class="snd" id="set" aria-label="الإعدادات">⚙️</button>
  </div>
</div>

<div class="hero-ring-container">
  <svg viewBox="0 0 160 160">
    <circle cx="80" cy="80" r="68" fill="none" stroke="var(--field)" stroke-width="14"></circle>
    <circle id="mainRingProgress" cx="80" cy="80" r="68" fill="none" stroke="var(--mint)" stroke-width="14" stroke-linecap="round" stroke-dasharray="427" stroke-dashoffset="427"></circle>
  </svg>
  <div class="hero-ring-content">
    <span id="ringPercent">0%</span>
    <span id="ringCount">0 من 0</span>
  </div>
</div>

<div class="hero">
  <div class="pip" id="pip"></div>
  <p class="sub-text" id="sub"></p>
  <div class="lv-box">
    <span id="lvt"></span>
    <div class="lvb"><i id="lvf"></i></div>
  </div>
</div>

<div class="tabs" id="tabs">
  <button data-v="all" class="sel">الكل</button>
  <button data-v="today">النهارده</button>
  <button data-v="am">الصبح</button>
  <button data-v="pm">المسا</button>
</div>

<div id="list"></div>
</main>

<button class="fab" id="fab">＋ عادة جديدة</button>
<div class="back" id="back"></div>

<div class="sheet" id="sheet">
<h2 id="fh">عادة جديدة</h2>
<div class="pick" id="tps"></div>
<label for="inp">اسم العادة</label>
<input id="inp" placeholder="مثلًا: اشرب مياه" maxlength="30">
<label>نوع العادة</label><div class="pick" id="kds"></div>
<label for="why">ليه بعمل العادة دي؟ (اختياري)</label>
<input id="why" maxlength="60">
<label>اختار رمز</label>
<div class="emos" id="emos"></div>
<label id="cl">كام مرة في اليوم؟</label>
<div class="step" id="stpr"><button id="minus">−</button><b id="num">1</b><button id="plus">+</button></div>
<label>أيام العادة</label><div class="pick" id="dws"></div>
<label>وقت العادة</label><div class="pick" id="per"></div>
<button class="go" id="go">أضف العادة</button>
</div>

<div class="sheet" id="info">
<h2>إحصائياتي</h2>
<p class="note">الملخص والأداء</p>
</div>

<div class="sheet" id="setp">
<h2>الإعدادات</h2>
<p class="dev">تطوير: محمد سامح</p>
</div>

<div class="toast" id="toast"></div>

<script>
var KEY="habits-v1", habits=[], selE="💧", selN=1, edit=-1, selC=0, selP=3, bd={}, view="all", selD=[1,1,1,1,1,1,1], selK=0;
var PER=["الصبح","الضهر","المسا","أي وقت"], EMO=["💧","🏃","📖","🧘","🍎","😴","💊","⭐"], DW=["حد","اتنين","تلات","أربع","خميس","جمعة","سبت"];
var PETS=[{id:"cat",name:"قطة مشمش",lvl:1,body:"G",ear:"point"}];

function E(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function $(i){return document.getElementById(i)}
function load(){try{var r=localStorage.getItem(KEY);habits=r?JSON.parse(r):[];bd=JSON.parse(localStorage.getItem("habits-bd")||"{}")}catch(e){habits=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(habits));localStorage.setItem("habits-bd",JSON.stringify(bd))}catch(e){}}
function dk(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
function back(n){var d=new Date();d.setDate(d.getDate()-n);return d}
function today(){return dk(back(0))}
function ok(h,k){return (h.days[k]||0)>=(h.t||1)}
function streak(h){var n=0;for(var i=0;i<100;i++){if(ok(h,dk(back(i))))n++;else if(i>0)break}return n}
function lvl(t){return Math.floor(Math.sqrt(t/10))+1}
function met(){var s=0;habits.forEach(function(h){for(var k in h.days)s+=h.days[k]});return{tot:s}}

function render(){
  var list=$("list");list.innerHTML="";
  var t=today(),done=0,act=0;
  habits.forEach(function(h){if(!h.id)h.id=Math.random().toString(36).slice(2,9);act++;if(ok(h,t))done++;});
  
  $("sub").textContent=!habits.length?"ابدأ بأول عادة":"أنجزت "+done+" من "+act+" النهارده";
  var ratio=act?(done/act):0;
  $("mainRingProgress").style.strokeDashoffset=427-(427*ratio);
  $("ringPercent").textContent=Math.round(ratio*100)+"%";
  $("ringCount").textContent=done+" / "+act;

  document.querySelectorAll("#tabs button").forEach(function(b){b.classList.toggle("sel",b.dataset.v===view)});

  if(!habits.length){
    list.innerHTML='<div style="text-align:center;color:var(--mute);padding:30px">مفيش عادات لسه. دوس على الزرار تحت لإضافة عادة جديدة.</div>';
    return;
  }

  habits.forEach(function(h,idx){
    var T=h.t||1,cnt=h.days[t]||0,fin=cnt>=T;
    var c=E("div","card");
    var row=E("div","row");
    var em=E("div","emo",h.e||"⭐");row.appendChild(em);
    
    var mid=E("div","mid");
    mid.appendChild(E("div","nm",h.name));
    mid.appendChild(E("div","meta",streak(h)+" يوم سلسلة"));
    row.appendChild(mid);

    var b=E("button","big"+(fin?" done":""),fin?"✓":cnt+"/"+T);
    b.onclick=function(){
      h.days[t]=fin?0:cnt+1;
      save();render();
    };
    row.appendChild(b);
    c.appendChild(row);
    list.appendChild(c);
  });
}

function sheet(on,id){
  $("sheet").classList.toggle("on",on&&id==="sheet");
  $("info").classList.toggle("on",on&&id==="info");
  $("setp").classList.toggle("on",on&&id==="setp");
  $("back").classList.toggle("on",on);
}

$("fab").onclick=function(){edit=-1;$("inp").value="";sheet(true,"sheet")};
$("stb").onclick=function(){sheet(true,"info")};
$("set").onclick=function(){sheet(true,"setp")};
$("back").onclick=function(){sheet(false)};

$("minus").onclick=function(){selN=Math.max(1,selN-1);$("num").textContent=selN};
$("plus").onclick=function(){selN=Math.min(20,selN+1);$("num").textContent=selN};

$("go").onclick=function(){
  var v=$("inp").value.trim();
  if(!v){$("inp").focus();return;}
  habits.push({id:Math.random().toString(36).slice(2,9),name:v,t:selN,e:selE,days:{}});
  save();sheet(false);render();
};

document.querySelectorAll("#tabs button").forEach(function(b){
  b.onclick=function(){view=b.dataset.v;render();}
});

load();render();
</script>
</body>
</html>
