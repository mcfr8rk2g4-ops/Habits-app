<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#eceaff">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="عاداتي">
<title>عاداتي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap">
<style>
:root{--bg:#eceaff;--ink:#1d1b3a;--sheet:#fff;--field:#f1efff;--mute:#6d6a96;--sun:#ffd54a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17152e;--ink:#eceaff;--sheet:#24214a;--field:#1a1838;--mute:#a3a0cc;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17152e;--ink:#eceaff;--sheet:#24214a;--field:#1a1838;--mute:#a3a0cc;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo Bhaijaan 2",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.4}
main{max-width:520px;margin:0 auto;padding:20px 16px 120px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:34px;font-weight:800;margin:0}
.snd{width:44px;height:44px;border-radius:50%;border:0;background:var(--sheet);font-size:20px;cursor:pointer;box-shadow:0 3px 0 rgba(29,27,58,.2)}
.hero{background:var(--ink);color:var(--bg);border-radius:28px;padding:16px 18px 18px;margin-bottom:20px;box-shadow:0 6px 0 rgba(29,27,58,.28)}
.hero p{margin:0 0 10px;font-size:19px;font-weight:700}
.bar{height:16px;border-radius:16px;background:rgba(128,128,160,.35);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--sun);border-radius:16px;transition:width .45s cubic-bezier(.3,1.4,.5,1)}
.card{background:var(--c);color:#1d1b3a;border-radius:28px;padding:16px;margin-bottom:18px;box-shadow:0 6px 0 rgba(29,27,58,.3)}
.card.pop{animation:pop .4s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{0%{transform:scale(.95)}100%{transform:scale(1)}}
.row{display:flex;align-items:center;gap:12px}
.emo{flex:none;font-size:32px;width:56px;height:56px;border-radius:18px;background:rgba(255,255,255,.55);display:grid;place-items:center}
.mid{flex:1;min-width:0}
.nm{font-weight:800;font-size:21px;line-height:1.2;overflow-wrap:anywhere}
.meta{font-size:15px;font-weight:500;opacity:.75}
.big{flex:none;width:68px;height:68px;border-radius:50%;border:0;background:#fff;color:#1d1b3a;font:inherit;font-weight:800;font-size:22px;box-shadow:0 5px 0 rgba(29,27,58,.38);cursor:pointer;transition:transform .08s,box-shadow .08s;touch-action:manipulation}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(29,27,58,.38)}
.big.done{background:#1d1b3a;color:#fff}
.track{height:12px;border-radius:12px;background:rgba(29,27,58,.16);margin:14px 0 10px;overflow:hidden}
.track i{display:block;height:100%;background:#1d1b3a;border-radius:12px;transition:width .3s}
.week{display:flex;gap:6px}
.wd{flex:1;border:0;height:32px;border-radius:10px;background:rgba(255,255,255,.4);color:#1d1b3a;font:inherit;font-size:13px;font-weight:700;padding:0;cursor:pointer}
.wd.full{background:#1d1b3a;color:#fff}
.wd.part{background:rgba(255,255,255,.95)}
.wd.today{outline:2px solid #1d1b3a;outline-offset:2px}
.del{background:none;border:0;font:inherit;font-size:14px;font-weight:600;color:#1d1b3a;opacity:.6;padding:10px 0 0;cursor:pointer}
.empty{text-align:center;color:var(--mute);padding:36px 8px;font-size:18px}
.empty b{display:block;font-size:56px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:0 28px;height:60px;border:0;border-radius:30px;background:var(--sun);color:#1d1b3a;font:inherit;font-weight:800;font-size:20px;box-shadow:0 5px 0 rgba(29,27,58,.4);cursor:pointer;white-space:nowrap;z-index:5}
.fab:active{transform:translateX(-50%) translateY(4px);box-shadow:0 1px 0 rgba(29,27,58,.4)}
.back{position:fixed;inset:0;background:rgba(20,18,50,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.back.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;background:var(--sheet);border-radius:28px 28px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .35s cubic-bezier(.3,1.2,.5,1);z-index:11}
.sheet.on{transform:none}
.sheet h2{margin:0 0 12px;font-size:22px;font-weight:800}
.sheet label{display:block;margin:14px 0 6px;font-weight:700;color:var(--mute);font-size:15px}
#inp{width:100%;padding:12px 14px;font:inherit;font-size:17px;border:0;border-radius:16px;background:var(--field);color:var(--ink)}
.emos{display:flex;gap:8px;flex-wrap:wrap}
.emos button{width:48px;height:48px;font-size:24px;border:0;border-radius:14px;background:var(--field);cursor:pointer}
.emos button.sel{outline:3px solid var(--ink)}
.step{display:flex;align-items:center;gap:16px}
.step button{width:48px;height:48px;border-radius:50%;border:0;background:var(--field);color:var(--ink);font:inherit;font-size:26px;font-weight:800;cursor:pointer}
.step b{min-width:40px;text-align:center;font-size:28px}
.go{width:100%;margin-top:20px;height:56px;border:0;border-radius:28px;background:var(--ink);color:var(--bg);font:inherit;font-weight:800;font-size:20px;box-shadow:0 5px 0 rgba(128,128,160,.45);cursor:pointer}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(128,128,160,.45)}
.head .r{display:flex;gap:8px}
.gh{margin:18px 0 8px;font-size:18px;font-weight:800;color:var(--mute)}
.mv{background:none;border:0;font:inherit;font-size:18px;color:#1d1b3a;opacity:.6;padding:10px 8px 0;cursor:pointer}
.foot{display:flex;align-items:center}.foot .sp{flex:1}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick button{min-width:48px;height:44px;padding:0 12px;border:0;border-radius:14px;background:var(--field);color:var(--ink);font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.pick button.sel{outline:3px solid var(--ink)}
.pick .sw{width:44px;min-width:44px;padding:0;background:var(--c)}
#tm{padding:10px 14px;font:inherit;font-size:17px;border:0;border-radius:14px;background:var(--field);color:var(--ink)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat i{aspect-ratio:1;border-radius:7px;background:var(--field)}
.heat i.f{background:#5fe0b7}
.kp{display:flex;gap:8px}.kp div{flex:1;background:var(--field);border-radius:16px;padding:10px 6px;text-align:center;font-weight:800;font-size:26px}.kp small{display:block;font-size:12px;color:var(--mute);font-weight:600;line-height:1.2}
.bds{display:flex;gap:8px;flex-wrap:wrap}.bds span{background:var(--field);border-radius:14px;padding:6px 10px;font-size:14px;font-weight:700;opacity:.4}.bds span.on{opacity:1;background:var(--sun);color:#1d1b3a}
#bk{width:100%;height:70px;border:0;border-radius:14px;background:var(--field);color:var(--ink);font-size:13px;padding:8px;direction:ltr}
.sheet{max-height:92vh;overflow:auto}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:20px;font-weight:700;z-index:60;transition:transform .35s cubic-bezier(.3,1.4,.5,1);max-width:90%;text-align:center}
.toast.on{transform:translate(-50%,0)}
.opt{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-weight:700;font-size:18px}
.tg{width:58px;height:34px;border:0;border-radius:20px;background:var(--field);position:relative;cursor:pointer;transition:background .2s}
.tg::after{content:"";position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:var(--mute);transition:transform .2s,background .2s}
.tg.on{background:#5fe0b7}.tg.on::after{transform:translateX(-24px);background:#1d1b3a}
.note{font-size:13px;color:var(--mute);margin:4px 0 0}
.emo svg{width:44px;height:44px}.emos button svg{width:36px;height:36px}
.lv{display:flex;align-items:center;gap:10px;margin-top:12px;font-weight:700;font-size:15px}.lv svg{width:30px;height:30px;flex:none}
.lvb{flex:1;height:8px;border-radius:8px;background:rgba(128,128,160,.35);overflow:hidden}.lvb i{display:block;height:100%;width:0;background:#5fe0b7;border-radius:8px;transition:width .4s}
.wd.off{opacity:.45}
.snd svg{width:30px;height:30px}
.ol{display:flex;align-items:center;gap:10px}.ol i{width:34px;height:34px;display:block}.ol svg{width:34px;height:34px}
.pick button{display:inline-flex;align-items:center;justify-content:center;gap:6px}.pick button svg{width:26px;height:26px}
.gh{display:flex;align-items:center;gap:8px}.gh svg{width:28px;height:28px}
.meta{display:flex;align-items:center;gap:6px}.meta svg{width:20px;height:20px}
.hero{position:relative;margin-top:44px}
.pip{position:absolute;left:10px;top:-46px;width:88px;height:88px;pointer-events:none}
.pip svg{width:100%;height:100%;transform:scale(var(--s,1));transform-origin:50% 100%;overflow:visible}
.pip .mh{display:none}.pip.hp .mh{display:block}.pip.hp .mn{display:none}
.pip.jump{animation:jmp .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes jmp{0%{transform:translateY(0)}35%{transform:translateY(-22px) scale(1.08,.94)}70%{transform:translateY(0) scale(.94,1.06)}100%{transform:none}}
@media (prefers-reduced-motion:no-preference){
.pip .bd{transform-origin:50% 92%;animation:br 2.4s ease-in-out infinite}
.pip .ey{transform-origin:50% 58%;animation:bl 4.5s infinite}
.pip.hp .bd{animation:br .7s ease-in-out infinite}
@keyframes br{0%,100%{transform:scale(1,1)}50%{transform:scale(1.04,.96)}}
@keyframes bl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.card.in{animation:rise .5s cubic-bezier(.3,1.4,.5,1) both}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.96)}}
.card.pop .emo svg{animation:wig .5s}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg) scale(1.15)}60%{transform:rotate(10deg) scale(1.1)}}
}
#tps{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;margin-bottom:2px}#tps button{flex:none}
.pick .dg{background:#d6282a;color:#fff}
.toast{display:flex;align-items:center;justify-content:center;gap:8px}.toast i{flex:none;display:block;width:26px;height:26px}.toast svg{width:26px;height:26px;display:block}
.hero p{display:flex;align-items:center;gap:8px}.hero p svg{width:28px;height:28px;flex:none}
.empty b{display:flex;justify-content:center}.empty b svg{width:84px;height:84px}
.why{font-size:14px;font-weight:500;opacity:.8;margin-top:8px}
#why{width:100%;padding:12px 14px;font:inherit;font-size:16px;border:0;border-radius:16px;background:var(--field);color:var(--ink)}
.bds span{display:inline-flex;align-items:center;gap:6px}.bds svg{width:22px;height:22px}
.pip{pointer-events:auto;cursor:pointer}
.bub{position:absolute;left:104px;max-width:calc(100% - 118px);top:-44px;min-height:36px;display:flex;align-items:center;background:var(--sheet);color:var(--ink);border-radius:16px;padding:6px 12px;font-size:14px;font-weight:700;line-height:1.25;box-shadow:0 3px 0 rgba(29,27,58,.2)}
.bub::before{content:"";position:absolute;left:-6px;top:50%;margin-top:-6px;border:6px solid transparent;border-right-color:var(--sheet);border-left:0}
.bub:empty{display:none}
.pip .ms{display:none}.pip.sd .ms{display:block}.pip.sd .mn{display:none}
.prev{display:grid;place-items:center;height:140px}.prev svg{height:130px;width:130px;overflow:visible}.prev .mh,.prev .ms{display:none}
#mnm{width:100%;padding:12px 14px;font:inherit;font-size:16px;border:0;border-radius:16px;background:var(--field);color:var(--ink)}
.pick button:disabled{opacity:.4;cursor:default}
#vu,#vst,#vt,#rsx{width:100%;padding:12px 14px;font:inherit;font-size:16px;border:0;border-radius:16px;background:var(--field);color:var(--ink)}#rsx{resize:none}
.steps{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.stp{border:0;border-radius:12px;padding:9px 12px;text-align:right;font:inherit;font-weight:700;font-size:15px;background:rgba(255,255,255,.45);color:#1d1b3a;cursor:pointer}
.stp.on{background:#1d1b3a;color:#fff;text-decoration:line-through}
.dev{text-align:center;margin-top:20px;font-size:14px;font-weight:700;color:var(--mute)}
.tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px}
.tabs button{flex:1;min-width:max-content;height:42px;padding:0 14px;border:0;border-radius:14px;background:var(--sheet);color:var(--ink);font:inherit;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 3px 0 rgba(29,27,58,.15)}
.tabs button.sel{background:var(--ink);color:var(--bg)}
.ring{display:none;flex-direction:column;align-items:center;position:relative;margin:4px auto 18px;width:170px;height:170px}
.ring svg{width:170px;height:170px}
.ring .rt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring b{font-size:34px;font-weight:800;line-height:1.1}.ring span{font-size:14px;color:var(--mute);font-weight:700}
@media (prefers-reduced-motion:no-preference){.ring circle:nth-child(2){animation:ringin .8s ease-out}@keyframes ringin{from{stroke-dasharray:0 400}}}
.arh{width:100%;margin-top:6px;height:44px;border:0;border-radius:14px;background:var(--sheet);color:var(--mute);font:inherit;font-weight:700;cursor:pointer}
.arow{display:flex;align-items:center;gap:12px;background:var(--sheet);border-radius:14px;padding:8px 14px;margin-top:8px;font-weight:700}.arow span{flex:1;overflow-wrap:anywhere}.arow .del{padding:8px 4px;color:var(--ink)}
.foot{flex-wrap:wrap}
.qs{margin-top:10px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:10px}.qs .lvb{flex:none;width:80px}
.lvb{height:8px;border-radius:8px;background:rgba(128,128,160,.35);overflow:hidden}.lvb i{display:block;height:100%;width:0;background:#5fe0b7;border-radius:8px}
.nl{margin-top:8px;background:var(--field);border-radius:14px;padding:10px 12px;font-size:14px;font-weight:600;overflow-wrap:anywhere}.nl small{display:block;color:var(--mute)}
#ntx,#rwt,#rwn,#chn,#chd,#chc{width:100%;padding:12px 14px;font:inherit;font-size:16px;border:0;border-radius:16px;background:var(--field);color:var(--ink)}#ntx,#chc{resize:none}
.rwi{background:var(--field);border-radius:16px;padding:12px;margin-top:8px;font-weight:700}.rwi .lvb{margin:8px 0}
.dtk{display:flex;gap:8px;margin:10px 0}.dtk div{flex:1;background:var(--field);border-radius:14px;padding:8px 4px;text-align:center;font-weight:800;font-size:22px}.dtk small{display:block;font-size:11px;color:var(--mute);font-weight:600}
.cht{width:100%;height:90px;display:block}
#yimg{width:100%;border-radius:16px;margin-top:8px}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<main>
<div class="head"><h1>عاداتي</h1><div class="r"><button class="snd" id="stb" aria-label="إحصائيات">📊</button><button class="snd" id="set" aria-label="الإعدادات">⚙️</button></div></div>
<div class="hero"><div class="pip" id="pip"></div><div class="bub" id="bub"></div><p id="sub"></p><div class="bar"><i id="fill"></i></div><div class="lv"><span id="lvt"></span><div class="lvb" style="flex:1"><i id="lvf"></i></div></div><div class="qs"><span id="qt"></span><div class="lvb"><i id="qf"></i></div></div></div>
<div class="tabs" id="tabs"><button data-v="all">الكل</button><button data-v="today">النهارده</button><button data-v="am">الصبح</button><button data-v="pm">المسا</button></div>
<div class="ring" id="ring"></div>
<div id="list"></div>
</main>
<button class="fab" id="fab">＋ عادة جديدة</button>
<div class="back" id="back"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="عادة جديدة">
<h2 id="fh">عادة جديدة</h2>
<div class="pick" id="tps"></div>
<label for="inp">اسم العادة</label>
<input id="inp" placeholder="مثلًا: اشرب مياه" maxlength="30">
<label>نوع العادة</label><div class="pick" id="kds"></div>
<div id="fv" style="display:none"><label for="vt">الهدف اليومي (رقم)</label><input id="vt" type="number" min="1" inputmode="numeric"><label for="vst">الكمية في كل ضغطة</label><input id="vst" type="number" min="1" inputmode="numeric"><label for="vu">الوحدة (مثلًا مل أو صفحة)</label><input id="vu" maxlength="8"></div>
<div id="fr" style="display:none"><label for="rsx">خطوات الروتين (كل خطوة في سطر)</label><textarea id="rsx" rows="4"></textarea></div>
<label for="why">ليه بعمل العادة دي؟ (اختياري)</label>
<input id="why" maxlength="60">
<label>اختار رمز</label>
<div class="emos" id="emos"></div>
<label id="cl">كام مرة في اليوم؟</label>
<div class="step" id="stpr"><button id="minus" aria-label="أقل">−</button><b id="num">1</b><button id="plus" aria-label="أكتر">+</button></div>
<label>اللون</label><div class="pick" id="sws"></div>
<label>أيام العادة</label><div class="pick" id="dws"></div>
<label>وقت العادة</label><div class="pick" id="per"></div>
<label>بعد عادة (اختياري)</label><div class="pick" id="afs"></div>
<label for="tm">تذكير وانت فاتح التطبيق (اختياري)</label>
<input id="tm" type="time">
<button class="go" id="go">أضف العادة</button>
</div>
<div class="sheet" id="info" role="dialog" aria-label="إحصائيات">
<h2>إحصائياتي</h2>
<div class="kp"><div><span id="k1">0</span><small>أطول سلسلة أيام</small></div><div><span id="k2">0%</span><small>التزام آخر 30 يوم</small></div><div><span id="k3">0</span><small>مرات كلها</small></div></div>
<label>آخر 5 أسابيع</label><div class="heat" id="heat"></div>
<label>إنجازاتي</label><div class="bds" id="bds"></div>
<label>أدوات</label><div class="pick"><button id="bRw">المكافآت</button><button id="bCh">تحدي</button><button id="bNt">ملاحظات</button><button id="bYr">ملخص السنة</button></div>
<label for="bk">نسخة احتياطية</label>
<textarea id="bk" placeholder="اضغط انسخ لتجهيز النسخة، أو الصق نسخة قديمة هنا واضغط استرجع"></textarea>
<div class="pick" style="margin-top:8px"><button id="cp">انسخ</button><button id="rs">استرجع</button><button id="csv">تصدير جدول</button></div>
</div>
<div class="sheet" id="setp" role="dialog" aria-label="الإعدادات">
<h2>الإعدادات</h2>
<div class="opt"><span class="ol"><i id="isS"></i>الصوت</span><button class="tg" id="tgS" role="switch" aria-label="الصوت"></button></div>
<div class="opt"><span class="ol"><i id="isV"></i>الاهتزاز</span><button class="tg" id="tgV" role="switch" aria-label="الاهتزاز"></button></div>
<p class="note">على الايفون الاهتزاز بيشتغل مع iOS 17.4 أو أحدث، وعلى أندرويد عادي. لو مفيش اهتزاز فجهازك غالبًا مش بيدعمه.</p>
<div class="pick" style="margin-top:8px"><button id="tv">جرّب الاهتزاز</button></div><p class="note" id="vs"></p>
<label>المظهر</label><div class="pick" id="thp"></div>
<label>البيانات</label><div class="pick"><button id="clr">امسح كل العادات</button></div>
<p class="dev">تطوير: محمد سامح</p>
</div>
<div class="sheet" id="mp" role="dialog" aria-label="المخلوق">
<h2>مخلوقي</h2>
<div class="prev" id="mpv"></div>
<label for="mnm">اسمه</label><input id="mnm" maxlength="14" placeholder="بيب">
<label>لونه</label><div class="pick" id="mcl"></div>
<label>إكسسواراته</label><div class="pick" id="mac"></div>
